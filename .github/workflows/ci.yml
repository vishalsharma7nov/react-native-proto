name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint -w @vishalsharma7nov/react-native-proto
      - name: Typecheck
        run: npm run typecheck -w @vishalsharma7nov/react-native-proto
      - name: Test
        run: npm run test -w @vishalsharma7nov/react-native-proto
      - name: Build
        run: npm run build -w @vishalsharma7nov/react-native-proto
