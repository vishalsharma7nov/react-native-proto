name: sync-protos

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [protos-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm install
      - name: Sync protos
        run: npm run sync:protos
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync protos from lock file'
          title: 'chore: sync protos'
          body: |
            Automated sync from `protos.lock.json` (GitHub or local source).
            Review generated diffs before merging.
          branch: chore/sync-protos
